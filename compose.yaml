services:
  jupyter:
    build:
      context: .
      args:
        OPENSYSML_KERNEL_VERSION: "0.9.3.dev20261008"
        OPENCODE_VERSION: "1.19.0"
    user: root
    working_dir: /home/keio/work
    command:
      - start-notebook.py
      - --ServerApp.root_dir=/home/keio/work
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-opensysml}"
      NB_USER: keio
      CHOWN_HOME: "yes"
      CHOWN_EXTRA: /home/keio/work/notebooks,/home/keio/work/models,/home/keio/state
      CHOWN_EXTRA_OPTS: "-R"
      HOME: /home/keio
      XDG_DATA_HOME: /home/keio/state/data
      XDG_CONFIG_HOME: /home/keio/state/config
      XDG_CACHE_HOME: /home/keio/state/cache
      XDG_STATE_HOME: /home/keio/state/state
      OPENCODE_CONFIG: /opt/course/opencode/opencode.json
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      COURSE_DATA_DIR: /home/keio/work/private-course-data
      COURSE_COLLECTOR_URL: "${COURSE_COLLECTOR_URL:-}"
      COURSE_COLLECTOR_ALLOW_HTTP: "${COURSE_COLLECTOR_ALLOW_HTTP:-0}"
      COURSE_SYNC_INTERVAL: "${COURSE_SYNC_INTERVAL:-120}"
      COURSE_SYNC_TIMEOUT: "${COURSE_SYNC_TIMEOUT:-8}"
      COURSE_SYNC_BATCH_SIZE: "${COURSE_SYNC_BATCH_SIZE:-50}"
      COURSE_FILE_SCAN_INTERVAL: "${COURSE_FILE_SCAN_INTERVAL:-12}"
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./workspace:/home/keio/work
      - ./workspace/samples:/home/keio/work/samples:ro
      - opencode-state:/home/keio/state
    restart: unless-stopped

volumes:
  opencode-state:
